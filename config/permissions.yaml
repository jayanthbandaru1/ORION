# Maps each MCP tool name to a permission tier.
# Tiers (least to most dangerous): READ, SAFE, REVERSIBLE, SENSITIVE, DESTRUCTIVE
# Logged on every call (core/permissions.py). Real interactive
# confirmation for SENSITIVE/DESTRUCTIVE is Phase 4 — until then those
# tiers are logged but not blocked.

# Phase 0/1 — filesystem, web search/fetch
list_files: READ
read_file: READ
web_search: READ
web_fetch: READ

# Phase 2 — Google Calendar
# v1.2 Stage 6 (low-friction permissions): create/update moved from
# SENSITIVE to REVERSIBLE per the expanded spec's explicit "routine
# calendar actions should not require repeated approval" — a real,
# deliberate loosening of the exact gate this project added after the
# Phase 2 incident (an accidental event created on the primary calendar
# during testing, before this confirmation flow existed). Delete stays
# DESTRUCTIVE — the spec is explicit that destructive/irreversible
# actions keep the high-friction gate; only routine reversible ones lose it.
calendar_get_events: READ
calendar_search: READ
calendar_find_free_time: READ
calendar_create_event: REVERSIBLE
calendar_update_event: REVERSIBLE
calendar_delete_event: DESTRUCTIVE

# v1.1 — iCloud Calendar (CalDAV), a second independent calendar source
# alongside Google Calendar above. Prefixed icloud_calendar_* since
# Ollama's tool namespace is flat across every connected MCP server.
# create/update: same v1.2 Stage 6 low-friction change as Google Calendar above.
icloud_calendar_list_calendars: READ
icloud_calendar_get_events: READ
icloud_calendar_search: READ
icloud_calendar_create_event: REVERSIBLE
icloud_calendar_update_event: REVERSIBLE
icloud_calendar_delete_event: DESTRUCTIVE

# Phase 2 — Gmail
gmail_search: READ
gmail_get_message: READ
gmail_get_thread: READ
gmail_create_draft: SAFE
gmail_update_draft: SAFE
gmail_send_draft: SENSITIVE

# Phase 2 — Tasks/reminders
task_list: READ
task_create: SAFE
task_update: SAFE
task_complete: SAFE
task_delete: REVERSIBLE

# Phase 2 — Coding tools (mcp_servers/coding/). list_files/read_file are
# named code_list_files/code_read_file here — Ollama's tool namespace is
# flat across every connected MCP server, so the Phase 0 filesystem
# server's names couldn't be reused without colliding.
code_list_files: READ
code_read_file: READ
write_file: SENSITIVE
edit_file: SENSITIVE
search_code: READ
run_tests: SAFE
git_status: READ
git_diff: READ
git_log: READ

# run_command is SENSITIVE by default; classify_tool_call() in
# core/permissions.py grants SAFE only when the first word of the
# command is in this allowlist.
run_command: SENSITIVE
run_command_allowlist:
  - pytest
  - python
  - git

# v1.2 Stage 3 — vision. A small separate model (moondream) describes
# images qwen3:8b itself can't see; computer_screenshot lives in the
# vision server since a screenshot is a vision input, not a control
# action (see mcp_servers/computer/ for actual mouse/keyboard control).
vision_describe_image: READ
computer_screenshot: SENSITIVE

# v1.2 Stage 14 — active vision tracking. Starting it is a real, ongoing
# privacy-relevant behavior change (continuous camera watching, not a
# one-shot capture) so it stays SENSITIVE; stopping it is always safe.
vision_start_tracking: SENSITIVE
vision_stop_tracking: SAFE

# v1.2 Stage 4 — real mouse/keyboard automation via pyautogui. Full
# remote control of the user's actual input devices — every action-
# taking tool here is DESTRUCTIVE, no exceptions. Only the read-only
# status check is READ.
computer_move_mouse: DESTRUCTIVE
computer_click: DESTRUCTIVE
computer_type_text: DESTRUCTIVE
computer_press_key: DESTRUCTIVE
computer_cursor_status: READ

# v1.2 Stage 5 — location/maps (keyless OpenStreetMap stack: Nominatim +
# OSRM). All read-only lookups, no side effects.
location_find_nearby: READ
location_get_directions: READ
location_estimate_travel_time: READ

# v1.2 Stage 7 — weather (Open-Meteo, keyless). Read-only lookups.
weather_get_current: READ
weather_get_forecast: READ

# v1.2 Stage 11 — broader personal-file search (config/authorized_paths.yaml).
# Separate from the coding sandbox's own list_files/read_file. Never
# exposes file contents — list/search/find/metadata are READ; open_file
# actually launches a real external program, so it's SENSITIVE.
list_directory: READ
search_files: READ
find_file: READ
get_file_metadata: READ
open_file: SENSITIVE
