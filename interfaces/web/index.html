<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ORION</title>
<style>
  :root {
    --bg: #04070a;
    --panel: #070d12;
    --border: #113a44;
    --cyan: #4df3ff;
    --cyan-dim: #1c8a9a;
    --text: #cdeff5;
    --text-dim: #6f98a1;
    --tier-read: #3ddc97;
    --tier-safe: #4fd6ff;
    --tier-reversible: #ffd166;
    --tier-sensitive: #ff9f43;
    --tier-destructive: #ff4d6d;
  }

  * { box-sizing: border-box; }

  body {
    background: radial-gradient(ellipse at 50% -10%, #0a1820 0%, var(--bg) 55%);
    color: var(--text);
    font-family: "Consolas", "SFMono-Regular", ui-monospace, monospace;
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
  }

  header {
    text-align: center;
    margin-bottom: 1.25rem;
  }

  h1 {
    margin: 0;
    font-size: 1.6rem;
    letter-spacing: 0.4em;
    color: var(--cyan);
    text-shadow: 0 0 12px rgba(77, 243, 255, 0.6), 0 0 30px rgba(77, 243, 255, 0.25);
    font-weight: 600;
  }

  header .subtitle {
    margin-top: 0.35rem;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  /* ORION core — a real state machine (idle/listening/thinking/speaking),
     driven by data-state on #core-wrap from actual system signals (see
     setOrionState in the script), not decorative frontend-only states. */
  #core-wrap {
    --emotion-color: var(--cyan);
    --amplitude: 0;
    position: relative;
    width: 120px;
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0.5rem auto 1.25rem;
  }

  .core-ring {
    position: absolute;
    border: 1px solid var(--cyan-dim);
    border-radius: 50%;
    opacity: 0.18;
  }
  .ring-inner { width: 56px; height: 56px; }
  .ring-mid   { width: 80px; height: 80px; }
  .ring-outer { width: 106px; height: 106px; }

  .particle-orbit {
    position: absolute;
    inset: 0;
    transform: rotate(var(--angle));
    pointer-events: none;
  }
  .particle {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 3px;
    height: 3px;
    margin: -1.5px 0 0 -1.5px;
    border-radius: 50%;
    background: var(--cyan);
    opacity: 0;
    transform: translateX(50px);
  }

  #core {
    position: relative;
    z-index: 2;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, var(--emotion-color) 0%, var(--cyan-dim) 55%, transparent 75%);
    box-shadow: 0 0 18px 4px color-mix(in srgb, var(--emotion-color) 55%, transparent);
    transition: box-shadow 0.4s ease, background 0.4s ease;
  }

  /* IDLE — calm, never fully static */
  #core-wrap[data-state="idle"] #core { animation: idle-breathe 4s ease-in-out infinite; }
  #core-wrap[data-state="idle"] .core-ring { animation: idle-ring-drift 7s ease-in-out infinite; }
  #core-wrap[data-state="idle"] .particle { opacity: 0.18; }
  @keyframes idle-breathe {
    0%, 100% { transform: scale(0.88); }
    50% { transform: scale(1.04); }
  }
  @keyframes idle-ring-drift {
    0%, 100% { opacity: 0.12; transform: scale(1); }
    50% { opacity: 0.22; transform: scale(1.03); }
  }

  /* LISTENING — attentive: rings pulse outward like sonar, particles
     drawn slightly inward, waveform-reactive via --amplitude from the
     mic's own analyser (see startRecording). */
  #core-wrap[data-state="listening"] #core {
    animation: listen-pulse 1s ease-in-out infinite;
    box-shadow: 0 0 calc(20px + var(--amplitude) * 24px) calc(6px + var(--amplitude) * 10px) color-mix(in srgb, var(--emotion-color) 70%, transparent);
  }
  @keyframes listen-pulse {
    0%, 100% { transform: scale(0.95); }
    50% { transform: scale(1.06); }
  }
  #core-wrap[data-state="listening"] .core-ring {
    border-color: var(--cyan);
    animation: listen-ring-expand 1.5s ease-out infinite;
  }
  #core-wrap[data-state="listening"] .ring-mid { animation-delay: 0.3s; }
  #core-wrap[data-state="listening"] .ring-outer { animation-delay: 0.6s; }
  @keyframes listen-ring-expand {
    0% { transform: scale(0.7); opacity: 0.55; }
    100% { transform: scale(1.12); opacity: 0; }
  }
  #core-wrap[data-state="listening"] .particle {
    opacity: 0.55;
    animation: listen-converge 1.5s ease-in-out infinite;
  }
  @keyframes listen-converge {
    0%, 100% { transform: translateX(50px); }
    50% { transform: translateX(40px); }
  }

  /* THINKING — orbital motion at staggered speeds, center stays stable */
  #core-wrap[data-state="thinking"] #core { animation: idle-breathe 2s ease-in-out infinite; }
  #core-wrap[data-state="thinking"] .particle { opacity: 0.7; }
  #core-wrap[data-state="thinking"] .particle-orbit { animation: spin 3.2s linear infinite; }
  #core-wrap[data-state="thinking"] .particle-orbit:nth-child(even) { animation-duration: 4.4s; animation-direction: reverse; }
  @keyframes spin { to { transform: rotate(calc(var(--angle) + 360deg)); } }
  #core-wrap[data-state="thinking"] .core-ring { opacity: 0.2; }

  /* SPEAKING — core reacts to real playback amplitude via --amplitude,
     driven per animation-frame from a Web Audio analyser on the actual
     playing audio (see playReplyAudio). Not a canned animation. */
  #core-wrap[data-state="speaking"] #core {
    transform: scale(calc(1 + var(--amplitude) * 0.4));
    box-shadow: 0 0 calc(18px + var(--amplitude) * 34px) calc(4px + var(--amplitude) * 12px) color-mix(in srgb, var(--emotion-color) 70%, transparent);
  }
  #core-wrap[data-state="speaking"] .core-ring {
    border-color: var(--emotion-color);
    opacity: calc(0.15 + var(--amplitude) * 0.45);
    transform: scale(calc(1 + var(--amplitude) * 0.12));
  }
  #core-wrap[data-state="speaking"] .particle {
    opacity: calc(0.3 + var(--amplitude) * 0.5);
  }

  /* HUD frame around the chat log */
  #hud {
    position: relative;
    width: min(720px, 100%);
    padding: 1.5rem;
    background: linear-gradient(180deg, rgba(10, 24, 30, 0.6), rgba(4, 8, 10, 0.6));
    border: 1px solid var(--border);
    box-shadow: inset 0 0 40px rgba(77, 243, 255, 0.04);
  }

  #hud::before, #hud::after,
  #hud .corner-br, #hud .corner-bl {
    content: "";
    position: absolute;
    width: 18px;
    height: 18px;
    border-color: var(--cyan);
    border-style: solid;
    opacity: 0.85;
  }
  #hud::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
  #hud::after  { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
  #hud .corner-bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }
  #hud .corner-br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

  #log {
    height: 56vh;
    overflow-y: auto;
    padding-right: 0.5rem;
    margin-bottom: 1rem;
  }

  #log::-webkit-scrollbar { width: 6px; }
  #log::-webkit-scrollbar-thumb { background: var(--cyan-dim); }

  .msg { margin-bottom: 1rem; line-height: 1.5; font-size: 0.92rem; }

  .msg .role {
    display: block;
    font-size: 0.68rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 0.2rem;
  }

  .msg.user { text-align: right; }
  .msg.user .role { color: var(--text-dim); }
  .msg.user .content { color: var(--text); }

  .msg.assistant { border-left: 2px solid var(--cyan-dim); padding-left: 0.75rem; }

  /* Rendered markdown inside .content */
  .content p { margin: 0 0 0.6em; }
  .content p:last-child { margin-bottom: 0; }
  .content strong { color: var(--cyan); font-weight: 600; }
  .content em { font-style: italic; color: var(--text); }
  .content h1, .content h2, .content h3 {
    margin: 0.8em 0 0.4em;
    font-size: 0.95rem;
    letter-spacing: 0.05em;
    color: var(--cyan);
  }
  .content h1:first-child, .content h2:first-child, .content h3:first-child { margin-top: 0; }
  .content ul, .content ol { margin: 0 0 0.6em; padding-left: 1.3em; }
  .content li { margin-bottom: 0.2em; }
  .content code {
    background: rgba(77, 243, 255, 0.08);
    border: 1px solid var(--border);
    padding: 0.05em 0.35em;
    border-radius: 2px;
    font-size: 0.88em;
  }
  .content pre {
    background: rgba(77, 243, 255, 0.05);
    border: 1px solid var(--border);
    padding: 0.6em 0.75em;
    overflow-x: auto;
    margin: 0 0 0.6em;
  }
  .content pre code { background: none; border: none; padding: 0; }
  .content a { color: var(--cyan); }
  .msg.assistant .role { color: var(--cyan); }

  .msg.error { border-left: 2px solid var(--tier-destructive); padding-left: 0.75rem; }
  .msg.error .role { color: var(--tier-destructive); }

  .tool-log {
    margin-top: 0.4rem;
    font-size: 0.72rem;
  }

  .tool-service {
    font-size: 0.66rem;
    letter-spacing: 0.12em;
    color: var(--text-dim);
    margin-top: 0.5rem;
  }
  .tool-service:first-child { margin-top: 0; }
  .tool-service::before { content: "\21B3 "; opacity: 0.6; }

  .tool-log .tool-line {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    color: var(--text-dim);
    margin-top: 0.15rem;
    padding-left: 1rem;
  }

  .tool-line .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    box-shadow: 0 0 6px currentColor;
    flex: none;
  }

  .tier-READ { color: var(--tier-read); }
  .tier-SAFE { color: var(--tier-safe); }
  .tier-REVERSIBLE { color: var(--tier-reversible); }
  .tier-SENSITIVE { color: var(--tier-sensitive); }
  .tier-DESTRUCTIVE { color: var(--tier-destructive); }

  #form { display: flex; gap: 0.6rem; }

  #input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.6rem 0.75rem;
    font-family: inherit;
    font-size: 0.9rem;
    outline: none;
  }
  #input:focus { border-color: var(--cyan); box-shadow: 0 0 10px rgba(77, 243, 255, 0.35); }

  #send {
    background: transparent;
    border: 1px solid var(--cyan-dim);
    color: var(--cyan);
    padding: 0.6rem 1.2rem;
    font-family: inherit;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-size: 0.75rem;
    cursor: pointer;
  }
  #send:hover { background: rgba(77, 243, 255, 0.1); border-color: var(--cyan); }

  #mic {
    background: transparent;
    border: 1px solid var(--cyan-dim);
    color: var(--cyan);
    width: 42px;
    flex: none;
    font-family: inherit;
    font-size: 1rem;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #mic:hover { background: rgba(77, 243, 255, 0.1); border-color: var(--cyan); }
  #mic.recording {
    background: rgba(255, 77, 109, 0.15);
    border-color: var(--tier-destructive);
    color: var(--tier-destructive);
    box-shadow: 0 0 14px rgba(255, 77, 109, 0.55);
    animation: pulse-fast 0.7s ease-in-out infinite;
  }
  #mic.processing {
    border-color: var(--tier-sensitive);
    color: var(--tier-sensitive);
  }

  .msg.voice .role::after {
    content: " \1F3A4";
  }

  .confirm-prompt {
    border-left: 2px solid var(--tier-sensitive);
    padding-left: 0.75rem;
  }
  .confirm-prompt.destructive { border-left-color: var(--tier-destructive); }
  .confirm-prompt .confirm-header {
    font-size: 0.68rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
    color: var(--tier-sensitive);
  }
  .confirm-prompt.destructive .confirm-header { color: var(--tier-destructive); }
  .confirm-action {
    font-size: 0.88rem;
    margin-bottom: 0.4rem;
    padding-left: 0.6rem;
    border-left: 2px solid currentColor;
  }
  .confirm-buttons { display: flex; gap: 0.6rem; margin-top: 0.7rem; }
  .confirm-buttons button {
    font-family: inherit;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.4rem 1.1rem;
    cursor: pointer;
    background: transparent;
  }
  .confirm-approve { border: 1px solid var(--tier-read); color: var(--tier-read); }
  .confirm-approve:hover:not(:disabled) { background: rgba(61, 220, 151, 0.12); }
  .confirm-deny { border: 1px solid var(--tier-destructive); color: var(--tier-destructive); }
  .confirm-deny:hover:not(:disabled) { background: rgba(255, 77, 109, 0.12); }
  .confirm-buttons button:disabled { opacity: 0.4; cursor: default; }

  #wake-status {
    margin-top: 0.4rem;
    font-size: 0.62rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  #wake-status .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-dim);
    flex: none;
  }
  #wake-status.armed .dot {
    background: var(--tier-read);
    box-shadow: 0 0 6px var(--tier-read);
    animation: pulse 2.5s ease-in-out infinite;
  }
  #wake-status.armed { color: var(--tier-read); }
  #wake-status.triggered .dot {
    background: var(--tier-sensitive);
    box-shadow: 0 0 8px var(--tier-sensitive);
    animation: pulse-fast 0.5s ease-in-out infinite;
  }
  #wake-status.triggered { color: var(--tier-sensitive); }
  #wake-status.error .dot { background: var(--tier-destructive); }
  #wake-status.error { color: var(--tier-destructive); }
</style>
</head>
<body>

<header>
  <h1>ORION</h1>
  <div class="subtitle">Omni-Responsive Intelligence &amp; Operations Nexus</div>
  <div id="wake-status"><span class="dot"></span><span id="wake-status-text">Wake word: off</span></div>
</header>

<div id="core-wrap" data-state="idle">
  <div class="core-ring ring-outer"></div>
  <div class="core-ring ring-mid"></div>
  <div class="core-ring ring-inner"></div>
  <div class="particle-orbit" style="--angle: 0deg"><span class="particle"></span></div>
  <div class="particle-orbit" style="--angle: 45deg"><span class="particle"></span></div>
  <div class="particle-orbit" style="--angle: 90deg"><span class="particle"></span></div>
  <div class="particle-orbit" style="--angle: 135deg"><span class="particle"></span></div>
  <div class="particle-orbit" style="--angle: 180deg"><span class="particle"></span></div>
  <div class="particle-orbit" style="--angle: 225deg"><span class="particle"></span></div>
  <div class="particle-orbit" style="--angle: 270deg"><span class="particle"></span></div>
  <div class="particle-orbit" style="--angle: 315deg"><span class="particle"></span></div>
  <div id="core"></div>
</div>

<div id="hud">
  <span class="corner-bl"></span><span class="corner-br"></span>
  <div id="log"></div>
  <form id="form">
    <input id="input" type="text" autocomplete="off" placeholder="Say something..." />
    <button id="mic" type="button" title="Hold to talk">&#127908;</button>
    <button id="send" type="submit">Send</button>
  </form>
</div>

<!-- Vendored (not CDN) — see WAKE_WORD_SETUP.md. IIFE builds, plain <script> tags,
     no bundler needed: window.PorcupineWeb / window.WebVoiceProcessor. -->
<script src="vendor/porcupine-web.min.js"></script>
<script src="vendor/web-voice-processor.min.js"></script>

<script>
  let conversationId = null;
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const coreWrap = document.getElementById("core-wrap");

  // --- ORION core state machine ---
  // data-state on #core-wrap drives every animation in the CSS above;
  // this is the one place that sets it, from real signals elsewhere in
  // this script (recording started, a fetch is in flight, audio is
  // actually playing) — never a decorative frontend-only state.
  const EMOTION_COLORS = {
    neutral: "#4df3ff",
    confident: "#3ddc97",
    concerned: "#ff9f43",
    serious: "#ff4d6d",
  };

  function setOrionState(state, emotion) {
    coreWrap.dataset.state = state;
    coreWrap.style.setProperty("--emotion-color", EMOTION_COLORS[emotion] || EMOTION_COLORS.neutral);
    mic.classList.toggle("recording", state === "listening");
  }

  // Shared by the listening-amplitude (mic input) and speaking-amplitude
  // (reply audio output) visualizations — samples RMS from a Web Audio
  // analyser once per frame and writes it to --amplitude, which the CSS
  // above reads directly. Real audio-reactive visuals, not a canned pulse.
  function startAmplitudeLoop(analyser) {
    const buf = new Float32Array(analyser.fftSize);
    let rafId;
    const tick = () => {
      analyser.getFloatTimeDomainData(buf);
      let sumSquares = 0;
      for (let i = 0; i < buf.length; i++) sumSquares += buf[i] * buf[i];
      const rms = Math.sqrt(sumSquares / buf.length);
      coreWrap.style.setProperty("--amplitude", Math.min(1, rms * 6).toFixed(3));
      rafId = requestAnimationFrame(tick);
    };
    tick();
    return () => {
      cancelAnimationFrame(rafId);
      coreWrap.style.setProperty("--amplitude", "0");
    };
  }

  function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // Small hand-rolled markdown renderer rather than a vendored library —
  // the model only ever produces a modest subset (bold/italic/headers/
  // lists/code/links), so a regex pass covers it without pulling in a
  // full CommonMark implementation. HTML-escape happens first so any
  // literal '<'/'>' in the model's own text can't turn into real tags —
  // only the markdown syntax this function explicitly recognizes does.
  function renderMarkdown(text) {
    let html = escapeHtml(text);

    html = html.replace(/```([\s\S]*?)```/g, (_, code) => "<pre><code>" + code.trim() + "</code></pre>");
    html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
    html = html.replace(/^### (.*)$/gm, "<h3>$1</h3>");
    html = html.replace(/^## (.*)$/gm, "<h2>$1</h2>");
    html = html.replace(/^# (.*)$/gm, "<h1>$1</h1>");
    html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    html = html.replace(/(?<!\w)\*([^*\n]+)\*(?!\w)/g, "<em>$1</em>");
    html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');

    // Consecutive "- " / "1. " lines become a single <ul>/<ol>.
    // Leading whitespace tolerated (sub-bullets) but flattened into one
    // list level rather than properly nested — full nested-list structure
    // isn't worth the complexity for what this needs to convey.
    html = html.replace(/(^|\n)((?:[ \t]*[-*] .*(?:\n|$))+)/g, (_, prefix, block) => {
      const items = block.trim().split("\n").map((l) => "<li>" + l.replace(/^[ \t]*[-*]\s+/, "") + "</li>").join("");
      return prefix + "<ul>" + items + "</ul>";
    });
    html = html.replace(/(^|\n)((?:[ \t]*\d+\. .*(?:\n|$))+)/g, (_, prefix, block) => {
      const items = block.trim().split("\n").map((l) => "<li>" + l.replace(/^[ \t]*\d+\.\s+/, "") + "</li>").join("");
      return prefix + "<ol>" + items + "</ol>";
    });

    // Remaining bare lines become paragraphs; skip blocks already tagged above.
    html = html
      .split(/\n{2,}/)
      .map((block) => {
        const t = block.trim();
        if (!t) return "";
        if (/^<(h[1-3]|ul|ol|pre)/.test(t)) return t;
        return "<p>" + t.replace(/\n/g, "<br>") + "</p>";
      })
      .join("");

    return html;
  }

  function appendMessage(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    const roleLabel = document.createElement("span");
    roleLabel.className = "role";
    roleLabel.textContent = role;
    const content = document.createElement("span");
    content.className = "content";
    content.innerHTML = renderMarkdown(text);
    div.appendChild(roleLabel);
    div.appendChild(content);
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  // Contextual HUD: group tool activity by the service it belongs to
  // (ORION > GMAIL > gmail_search [READ]) rather than a flat list — this
  // is what the spec's "reveal information dynamically based on context"
  // actually means for the one signal we have it for. It only appears
  // after a response arrives (the full tool_calls list, all at once);
  // showing which *specific* tool is running live, mid-request, would
  // need a streaming/WebSocket architecture this app doesn't have.
  function serviceForTool(name) {
    if (name.startsWith("calendar_")) return "CALENDAR";
    if (name.startsWith("gmail_")) return "GMAIL";
    if (name.startsWith("task_")) return "TASKS";
    if (name.startsWith("web_")) return "WEB";
    if (name === "list_files" || name === "read_file") return "FILESYSTEM";
    return "CODING"; // code_*, write_file, edit_file, search_code, run_command, run_tests, git_*
  }

  function appendToolLog(container, toolCalls) {
    if (!toolCalls || toolCalls.length === 0) return;
    const groups = new Map();
    for (const call of toolCalls) {
      const service = serviceForTool(call.name);
      if (!groups.has(service)) groups.set(service, []);
      groups.get(service).push(call);
    }

    const wrap = document.createElement("div");
    wrap.className = "tool-log";
    for (const [service, calls] of groups) {
      const serviceLine = document.createElement("div");
      serviceLine.className = "tool-service";
      serviceLine.textContent = service;
      wrap.appendChild(serviceLine);
      for (const call of calls) {
        const line = document.createElement("div");
        line.className = "tool-line";
        const dot = document.createElement("span");
        dot.className = "dot tier-" + call.tier;
        const label = document.createElement("span");
        label.className = "tier-" + call.tier;
        label.textContent = call.name + (call.denied ? " (denied)" : "") + " [" + call.tier + "]";
        line.appendChild(dot);
        line.appendChild(label);
        wrap.appendChild(line);
      }
    }
    container.appendChild(wrap);
  }

  // Renders a pending_confirmation as an inline approve/deny prompt using
  // the same tier colors as the tool-call log — PHASE4.md: amber for
  // SENSITIVE, red for DESTRUCTIVE, plain-language consequence per action.
  function renderPendingConfirmation(data) {
    const hasDestructive = data.pending_actions.some((a) => a.tier === "DESTRUCTIVE");
    const div = document.createElement("div");
    div.className = "msg confirm-prompt" + (hasDestructive ? " destructive" : "");

    const header = document.createElement("div");
    header.className = "confirm-header";
    header.textContent = hasDestructive ? "Confirmation required — destructive" : "Confirmation required";
    div.appendChild(header);

    for (const action of data.pending_actions) {
      const line = document.createElement("div");
      line.className = "confirm-action tier-" + action.tier;
      line.textContent = "[" + action.tier + "] " + action.description;
      div.appendChild(line);
    }

    const buttons = document.createElement("div");
    buttons.className = "confirm-buttons";
    const approveBtn = document.createElement("button");
    approveBtn.className = "confirm-approve";
    approveBtn.textContent = "Approve";
    const denyBtn = document.createElement("button");
    denyBtn.className = "confirm-deny";
    denyBtn.textContent = "Deny";
    buttons.appendChild(approveBtn);
    buttons.appendChild(denyBtn);
    div.appendChild(buttons);

    log.appendChild(div);
    log.scrollTop = log.scrollHeight;

    const resolve = async (approved) => {
      approveBtn.disabled = true;
      denyBtn.disabled = true;
      setOrionState("thinking");
      const thinking = appendMessage("assistant", "...");
      try {
        const response = await fetch("/chat/confirm", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ confirmation_id: data.confirmation_id, approved }),
        });
        if (!response.ok) throw new Error("HTTP " + response.status);
        const result = await response.json();
        thinking.remove();
        await renderChatResult(result);
      } catch (err) {
        thinking.remove();
        appendMessage("error", "Confirmation failed: " + err.message);
        setOrionState("idle");
      }
    };

    approveBtn.addEventListener("click", () => resolve(true));
    denyBtn.addEventListener("click", () => resolve(false));
  }

  // Plays a reply's synthesized audio with a real Web Audio analyser
  // driving the SPEAKING state's --amplitude — falls back to plain
  // playback with no visual reactivity if the analyser wiring fails
  // (autoplay/permission quirks vary by browser and can't be tested
  // from here), since actual playback is what matters functionally.
  let audioCtx = null;
  function playReplyAudio(base64Audio, emotion) {
    const audio = new Audio("data:audio/wav;base64," + base64Audio);
    currentAudio = audio;

    audio.addEventListener("play", () => {
      setOrionState("speaking", emotion);
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaElementSource(audio);
        const analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
        stopAmplitudeLoop = startAmplitudeLoop(analyser);
      } catch (err) {
        // Audio still plays via the plain element above — just without
        // amplitude-reactive visuals.
      }
    });

    const onEnd = () => {
      if (stopAmplitudeLoop) { stopAmplitudeLoop(); stopAmplitudeLoop = null; }
      if (currentAudio === audio) {
        currentAudio = null;
        setOrionState("idle", emotion);
      }
    };
    audio.addEventListener("ended", onEnd);
    audio.addEventListener("pause", onEnd);

    audio.play().catch(() => {});
  }

  // Shared by text chat, voice, and the confirm buttons — a response is
  // either a normal reply or another pending_confirmation (a later round
  // in the same turn can need its own approval), so every entry point
  // needs to handle both, not just the first one.
  async function renderChatResult(data, opts = {}) {
    conversationId = data.conversation_id;
    if (data.status === "pending_confirmation") {
      renderPendingConfirmation(data);
      // Idle, but tinted by emotion (serious/concerned) so the core
      // visually reflects the pending action while awaiting the human.
      setOrionState("idle", data.emotion);
      return;
    }
    const assistantDiv = appendMessage("assistant", data.reply);
    appendToolLog(assistantDiv, data.tool_calls);
    log.scrollTop = log.scrollHeight;
    if (opts.playAudio && data.audio_base64) {
      playReplyAudio(data.audio_base64, data.emotion);
    } else {
      setOrionState("idle", data.emotion);
    }
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    input.value = "";
    appendMessage("user", message);

    const thinking = appendMessage("assistant", "...");
    setOrionState("thinking");

    try {
      const response = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, conversation_id: conversationId }),
      });
      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }
      const data = await response.json();
      thinking.remove();
      await renderChatResult(data);
    } catch (err) {
      thinking.remove();
      appendMessage("error", "Failed to get a reply: " + err.message);
      setOrionState("idle");
    }
  });

  // --- Push-to-talk voice ---
  const mic = document.getElementById("mic");
  let mediaRecorder = null;
  let chunks = [];
  let currentAudio = null;
  let stopAmplitudeLoop = null;
  let stopListeningAmplitude = null;

  function stopPlayback() {
    // "Starting a new recording immediately stops any in-progress audio
    // playback" — the beta's whole interruption-handling requirement.
    if (currentAudio) {
      currentAudio.pause();
      currentAudio = null;
    }
    if (stopAmplitudeLoop) {
      stopAmplitudeLoop();
      stopAmplitudeLoop = null;
    }
  }

  async function startRecording() {
    stopPlayback();
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      appendMessage("error", "Microphone access denied or unavailable: " + err.message);
      return;
    }
    chunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach((t) => t.stop());
      if (stopListeningAmplitude) { stopListeningAmplitude(); stopListeningAmplitude = null; }
      sendRecording(new Blob(chunks, { type: mediaRecorder.mimeType || "audio/webm" }));
    };
    mediaRecorder.start();
    setOrionState("listening");

    // Real mic-input amplitude for the LISTENING visual — best-effort:
    // if analyser setup fails for any reason, recording still proceeds
    // fine without the waveform reactivity.
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioCtx.createMediaStreamSource(stream);
      const analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      source.connect(analyser);
      stopListeningAmplitude = startAmplitudeLoop(analyser);
    } catch (err) { /* no waveform reactivity, recording still works */ }
  }

  function finishRecording() {
    if (mediaRecorder && mediaRecorder.state !== "inactive") {
      mediaRecorder.stop();
    }
  }

  async function sendRecording(blob) {
    mic.classList.add("processing");
    setOrionState("thinking");
    const thinking = appendMessage("assistant", "...");

    try {
      const form = new FormData();
      form.append("audio", blob, "recording.webm");
      if (conversationId !== null) form.append("conversation_id", conversationId);

      const response = await fetch("/chat/voice", { method: "POST", body: form });
      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }
      const data = await response.json();
      thinking.remove();

      // Same rendering path as a text turn — this is what "voice/text
      // conversation continuity" means: a voice turn looks identical to
      // a typed one in the log afterward, just tagged with a mic icon.
      // If this pauses for confirmation, there's no reply/audio yet —
      // renderChatResult renders the approve/deny prompt instead.
      const userDiv = appendMessage("user", data.transcribed_text || "(inaudible)");
      userDiv.classList.add("voice");
      await renderChatResult(data, { playAudio: true });
    } catch (err) {
      thinking.remove();
      appendMessage("error", "Voice request failed: " + err.message);
      setOrionState("idle");
    } finally {
      mic.classList.remove("processing");
    }
  }

  mic.addEventListener("mousedown", startRecording);
  mic.addEventListener("touchstart", (e) => { e.preventDefault(); startRecording(); });
  mic.addEventListener("mouseup", finishRecording);
  mic.addEventListener("mouseleave", finishRecording);
  mic.addEventListener("touchend", (e) => { e.preventDefault(); finishRecording(); });

  // --- Wake word ("ORION") ---
  // Client-side detection via Porcupine (vendored IIFE build, see
  // SETUP.md) — audio never leaves the browser unless the wake word
  // actually fires, at which point it hands off to the exact same
  // sendRecording() path push-to-talk uses.
  const wakeStatus = document.getElementById("wake-status");
  const wakeStatusText = document.getElementById("wake-status-text");
  let porcupine = null;
  let wakeArmed = false;

  function setWakeStatus(cls, text) {
    wakeStatus.className = cls;
    wakeStatusText.textContent = text;
  }

  // Simple amplitude-based auto-stop: record until the user has spoken and
  // then gone quiet for SILENCE_MS, with a hard cap so a stuck mic can't
  // record forever. This is what lets wake-triggered recording end itself —
  // there's no button to release.
  const SILENCE_MS = 1200;
  const MAX_RECORDING_MS = 15000;
  const SPEECH_RMS_THRESHOLD = 0.02;

  async function recordUntilSilence() {
    stopPlayback();
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const audioCtx = new AudioContext();
    const source = audioCtx.createMediaStreamSource(stream);
    const analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    source.connect(analyser);
    const buf = new Float32Array(analyser.fftSize);

    const chunks = [];
    const recorder = new MediaRecorder(stream);
    recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };

    const done = new Promise((resolve) => {
      recorder.onstop = () => {
        stream.getTracks().forEach((t) => t.stop());
        audioCtx.close();
        resolve(new Blob(chunks, { type: recorder.mimeType || "audio/webm" }));
      };
    });

    recorder.start();
    setOrionState("listening");

    let hasSpoken = false;
    let silenceStart = null;
    const startTime = Date.now();

    await new Promise((resolve) => {
      const tick = () => {
        analyser.getFloatTimeDomainData(buf);
        let sumSquares = 0;
        for (let i = 0; i < buf.length; i++) sumSquares += buf[i] * buf[i];
        const rms = Math.sqrt(sumSquares / buf.length);
        // Same analyser drives both the silence-detection cutoff and the
        // LISTENING visual's --amplitude — no need for a second one.
        coreWrap.style.setProperty("--amplitude", Math.min(1, rms * 6).toFixed(3));

        const now = Date.now();
        if (rms > SPEECH_RMS_THRESHOLD) {
          hasSpoken = true;
          silenceStart = null;
        } else if (hasSpoken && silenceStart === null) {
          silenceStart = now;
        }

        const elapsed = now - startTime;
        const silentLongEnough = silenceStart !== null && now - silenceStart > SILENCE_MS;
        if ((hasSpoken && silentLongEnough) || elapsed > MAX_RECORDING_MS) {
          resolve();
          return;
        }
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });

    recorder.stop();
    coreWrap.style.setProperty("--amplitude", "0");
    return done;
  }

  async function onWakeWordDetected() {
    if (!wakeArmed) return;
    setWakeStatus("triggered", "ORION heard — listening...");
    try {
      await window.WebVoiceProcessor.WebVoiceProcessor.unsubscribe(porcupine);
    } catch (err) { /* already unsubscribed */ }

    try {
      const blob = await recordUntilSilence();
      await sendRecording(blob);
    } catch (err) {
      appendMessage("error", "Wake-word recording failed: " + err.message);
    } finally {
      if (wakeArmed) {
        try {
          await window.WebVoiceProcessor.WebVoiceProcessor.subscribe(porcupine);
          setWakeStatus("armed", "Wake word: listening for “ORION”");
        } catch (err) {
          setWakeStatus("error", "Wake word: failed to resume (" + err.message + ")");
        }
      }
    }
  }

  async function initWakeWord() {
    if (!window.PorcupineWeb || !window.WebVoiceProcessor) {
      setWakeStatus("", "Wake word: unavailable (vendor scripts missing)");
      return;
    }

    let accessKey = "";
    try {
      const cfg = await (await fetch("/config/voice")).json();
      accessKey = cfg.picovoice_access_key || "";
    } catch (err) {
      setWakeStatus("error", "Wake word: couldn't reach /config/voice");
      return;
    }
    if (!accessKey) {
      setWakeStatus("", "Wake word: not configured (see WAKE_WORD_SETUP.md)");
      return;
    }

    const keywordPath = "models/orion_keyword.ppn";
    const keywordCheck = await fetch(keywordPath, { method: "HEAD" }).catch(() => null);
    if (!keywordCheck || !keywordCheck.ok) {
      setWakeStatus("", "Wake word: keyword file missing (see WAKE_WORD_SETUP.md)");
      return;
    }

    try {
      porcupine = await window.PorcupineWeb.PorcupineWorker.create(
        accessKey,
        { publicPath: keywordPath, label: "orion" },
        onWakeWordDetected,
        { publicPath: "models/porcupine_params.pv" },
        { processErrorCallback: (err) => setWakeStatus("error", "Wake word error: " + err) },
      );
      await window.WebVoiceProcessor.WebVoiceProcessor.subscribe(porcupine);
      wakeArmed = true;
      setWakeStatus("armed", "Wake word: listening for “ORION”");
    } catch (err) {
      setWakeStatus("error", "Wake word: init failed (" + err.message + ")");
    }
  }

  initWakeWord();
</script>
</body>
</html>
